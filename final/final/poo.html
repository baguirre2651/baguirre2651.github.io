<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Videos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Navigation Bar */
        #q1-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            width: auto;
            max-width: 100vw;
            box-sizing: border-box;
            padding: 6px 48px 6px 24px;
            background-color: rgba(32, 40, 59, 0.98);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-family: "IBM Plex Sans", Arial, sans-serif;
        }

        .q1-navitem {
            position: relative;
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            line-height: 1;
            border-radius: 5px;
            padding: 5px 8px;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }

        .q1-navitem::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 1px;
            height: 2px;
            border-radius: 2px;
            background-color: white;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }

        .q1-navitem:hover,
        .q1-navitem:focus-visible {
            background-color: #2856aa;
            transform: translateY(-1px);
            outline: none;
        }

        .q1-navitem:hover::after,
        .q1-navitem:focus-visible::after {
            transform: scaleX(1);
        }
        /* Body and Fonts */
        html {
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #F4F3EF;
            font-family: 'Poppins', sans-serif;
            color: rgba(32, 40, 59, 0.979);
        }

        h2 {
            text-align: center;
            margin: 50px 0;
            font-size: 48px;
            font-weight: 500;
            font-family: 'Didot', serif;
            color: #202837;
        }

        /* Grid Layout */
        #videos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Video Container Styling */
        .video-container {
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .video-container:hover {
            transform: scale(1.03);
        }

        /* Image Styling */
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        /* Overlay with Title */
        .video-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: 600;
            color: white;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.6));
            font-family: 'Bodoni', sans-serif;
        }

        /* Media Query for Mobile */
        @media (max-width: 768px) {
            #videos {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <nav id="q1-navbar" aria-label="Main navigation">
        <a href="index.html" class="q1-navitem">Home</a>
        <a href="home.html#about" class="q1-navitem">About</a>
        <a href="home.html#work" class="q1-navitem">Work</a>
        <a href="home.html#contact" class="q1-navitem">Contact</a>
    </nav>

    <div id="media">
        <h2>Music Videos</h2>
        <div id="videos">
            <a href="https://youtu.be/7EWTjf5n6kk" target="_blank">
                <div class="video-container">
                    <img src="assets/videos/EE.png" alt="Ireland" loading="lazy" decoding="async">
                    <span class="video-title">Ireland</span>
                </div>
            </a>
            <a href="https://youtu.be/9G2Gl9u4O2A" target="_blank">
                <div class="video-container">
                    <img src="assets/videos/JP.png" alt="Japan" loading="lazy" decoding="async">
                    <span class="video-title">Japan</span>
                </div>
            </a>
            <a href="https://www.youtube.com/watch?v=p3Yi4r8Nf08&t=45s&ab_channel=BryanAguirre" target="_blank">
                <div class="video-container">
                    <img src="assets/videos/newyork.png" alt="New York" loading="lazy" decoding="async">
                    <span class="video-title">New York</span>
                </div>
            </a>
            <a href="https://youtu.be/1epCPWyym0s?si=Uq5Zvp5unfvvtzW4" target="_blank">
                <div class="video-container">
                    <img src="assets/videos/berlin.png" alt="Berlin" loading="lazy" decoding="async">
                    <span class="video-title">Berlin</span>
                </div>
            </a>
            <a href="https://www.youtube.com/watch?v=wEVXiJr_Ttc&ab_channel=BryanAguirre" target="_blank">
                <div class="video-container">
                    <img src="assets/videos/hawaii.png" alt="Hawaii" loading="lazy" decoding="async">
                    <span class="video-title">Hawaii</span>
                </div>
            </a>
            <a href="https://www.youtube.com/watch?v=Kbx1qkkAtu0&ab_channel=BryanAguirre" target="_blank">
                <div class="video-container">
                    <img src="assets/videos/spain.png" alt="Spain" loading="lazy" decoding="async">
                    <span class="video-title">Spain</span>
                </div>
            </a>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" type="text/css" href="assets/styles.css">
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    #clock-image {
      position: absolute;
      top: 15%;
      left: 30px;
      transform: translateY(-50%);
      width: 8%;
      z-index: 9999;
      transition: all 1s ease-out;
      animation: blink 5s infinite;
      cursor: pointer; /* Add cursor style to indicate it is clickable */
    }

    #sound-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 2147483647;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background-color: rgba(25, 25, 112, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.25s ease, box-shadow 0.25s ease;
    }

    #sound-button:hover {
      transform: translateY(-2px);
      background-color: rgba(40, 86, 170, 0.9);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    #sound-button #sound-icon {
      font-size: 14px;
      line-height: 1;
    }

    #sound-button.is-playing {
      background-color: rgba(253, 211, 0, 0.92);
      color: #191970;
      border-color: rgba(253, 211, 0, 0.92);
    }

    #sound-button.is-playing #sound-icon {
      animation: sound-pulse 0.9s ease-in-out infinite;
    }

    @keyframes sound-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    @media (prefers-reduced-motion: reduce) {
      #sound-button.is-playing #sound-icon { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome To My</h1>
    <h2>Website</h2>
  </header>

  <button id="sound-button" type="button" aria-label="Play Lady Love" aria-pressed="false">
    <span id="sound-icon" aria-hidden="true">♪</span>
    <span id="sound-label">Lady Love</span>
  </button>
  <div class="center-text">
    <p id="hover-text">Hover</p>
    <p>↓</p>
  </div>

  <audio id="song" preload="none">
    <source src="assets/music/flute.mp3" type="audio/mp3">
</audio>

<!-- No Surprises Song Audio Element -->
<audio id="no_surprises_song" preload="none">
    <source src="assets/music/No_Surprises.mp3" type="audio/mp3">
</audio>

<audio id="aphex_song" preload="none">
  <source src="assets/music/QKThr.mp3" type="audio/mp3">
</audio>

<!-- Lady Love Song Audio Element -->
<audio id="lady_love_song" preload="none">
  <source src="assets/music/LadyLove.mp3" type="audio/mp3">
</audio>


<script>
    // Dedicated sound button (bottom-left) toggles Lady Love without triggering
    // the whole-window click handler below.
    window.addEventListener('DOMContentLoaded', () => {
        const soundButton = document.getElementById("sound-button");
        const ladyLove = document.getElementById("lady_love_song");
        if (!soundButton || !ladyLove) return;

        const syncButton = () => {
            const playing = !ladyLove.paused;
            soundButton.classList.toggle('is-playing', playing);
            soundButton.setAttribute('aria-pressed', String(playing));
            soundButton.setAttribute('aria-label', playing ? 'Pause Lady Love' : 'Play Lady Love');
        };

        soundButton.addEventListener('click', (event) => {
            event.stopPropagation();
            if (ladyLove.paused) {
                ladyLove.play();
            } else {
                ladyLove.pause();
            }
        });

        ladyLove.addEventListener('play', syncButton);
        ladyLove.addEventListener('pause', syncButton);
        syncButton();
    });

    // Handle click to play or pause Lady Love song
    window.addEventListener('click', () => {
        const audioElement = document.getElementById("lady_love_song");

        if (audioElement.paused) {
            audioElement.play();
        } else {
            audioElement.pause();
        }
    });

    // Handle 'R' keypress to play or pause No Surprises song
    window.addEventListener('keydown', (event) => {
        if (event.key === 'r' || event.key === 'R') {
            const noSurprisesAudio = document.getElementById("no_surprises_song");
            if (noSurprisesAudio.paused) {
                noSurprisesAudio.play();
            } else {
                noSurprisesAudio.pause();
            }
        }
    });

    // Handle 'Q' keypress to play or pause Aphex Twin song
    window.addEventListener('keydown', (event) => {
        if (event.key === 'q' || event.key === 'Q') {
            const aphexAudio = document.getElementById("aphex_song"); // Fixed typo here
            if (aphexAudio.paused) {
                aphexAudio.play();
            } else {
                aphexAudio.pause();
            }
        }
    });

    // Handle 'L' keypress to play or pause flute song
    window.addEventListener('keydown', (event) => {
        if (event.key === 'l' || event.key === 'L') {
            const fluteAudio = document.getElementById("song");
            if (fluteAudio.paused) {
                fluteAudio.play();
            } else {
                fluteAudio.pause();
            }
        }
    });

    // Swap the "Hover" prompt to "Click" while hovering the house, since hovering just reveals it —
    // clicking is what actually enters the site.
    window.addEventListener('DOMContentLoaded', () => {
        const houseLink = document.getElementById('house-link');
        const hoverText = document.getElementById('hover-text');
        if (houseLink && hoverText) {
            houseLink.addEventListener('mouseenter', () => { hoverText.textContent = 'Click'; });
            houseLink.addEventListener('mouseleave', () => { hoverText.textContent = 'Hover'; });
        }
    });

</script>



  <nav>
    <div id="q1-navbar">
      <a href="index.html" class="q1-navitem">Home</a>
      <a href="home.html#home" class="q1-navitem">About</a>
      <a href="home.html#work" class="q1-navitem">Work</a>
      <a href="home.html#contact" class="q1-navitem">Contact</a>
    </div>
  </nav>

  <main>
    <img class="night-city" src="assets/images/city.gif" alt="" aria-hidden="true">
    <a href="home.html" id="house-link" aria-label="Enter the site"><img class="house" src="assets/images/house.png" alt="house"></a>
    <img class="moon" src="assets/images/moon.png" alt="moon">
    <img src="assets/images/cloud.png" alt="Cloud" id="cloud-image">
    <a href="vr.html"><img src="assets/images/cock 1.png" alt="clock" id="clock-image"></a>
    <img src="assets/images/optimized/p3-home.png" alt="Group 3 Image" id="shapes-image">
    <img src="assets/images/optimized/flowers-home.png" alt="Group 3 Image" id="flowers-image">
    <img src="assets/images/optimized/flowers-home.png" alt="Group 3 Image" id="flowers-image2">
    <img src="assets/images/walk 1.png" alt="Group 3 Image" id="walk">
    <img src="assets/images/walkman.gif" alt="Group 3 Image" id="figure">
    <img src="assets/images/optimized/flowers-home.png" alt="Group 3 Image" id="floimage">
    <img src="assets/images/optimized/image-home.png" alt="Group 3 Image" id="image2">
    <img id="stars_bot-image" src="assets/images/star2.png" alt="stars image">
    


    <!-- New hidden sections -->


  </main>
  

  <div class="container">
    <img src="assets/images/sunset-sun.gif" alt="Sun" id="sun">
  </div>
  

  <footer>
    <div class="rectangle"></div>
  </footer>

  <div class="triangle"></div>


  

  <script src="assets/script.js"></script>


</body>
</html>

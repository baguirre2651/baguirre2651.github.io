<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Webpage</title>
    <link rel="stylesheet" type="text/css" href="assets/vr.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        #q1-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            width: auto;
            max-width: 100vw;
            box-sizing: border-box;
            padding: 6px 48px 6px 24px;
            background-color: rgba(32, 40, 59, 0.98);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-family: "IBM Plex Sans", Arial, sans-serif;
        }

        .q1-navitem {
            position: relative;
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            line-height: 1;
            border-radius: 5px;
            padding: 5px 8px;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }

        .q1-navitem::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 1px;
            height: 2px;
            border-radius: 2px;
            background-color: white;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }

        .q1-navitem:hover,
        .q1-navitem:focus-visible {
            background-color: #2856aa;
            transform: translateY(-1px);
            outline: none;
        }

        .q1-navitem:hover::after,
        .q1-navitem:focus-visible::after {
            transform: scaleX(1);
        }

        :root {
            --bridge-height: 51.5vh;
            --bridge-top: var(--bridge-height);
            --character-width: clamp(72px, 6vw, 112px);
            --castle-height: clamp(310px, 46vh, 500px);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #191970;
            overflow: hidden;
        }

        body {
            position: relative;
        }

        #panorama {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #sun {
            position: fixed;
            top: calc(1% + 34px);
            left: 18%;
            width: clamp(86px, 7vw, 140px);
            aspect-ratio: 1;
            background-color: #fdd300;
            border-radius: 50%;
            box-shadow: 0 0 24px #fdd300;
            cursor: pointer;
            z-index: 5;
        }

        #bridge {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: var(--bridge-height);
            background-image: url("assets/images/bridge.png");
            background-size: cover;
            background-position: center top;
            z-index: 10;
            /* Feather the top edge so it blends into the night sky instead of
               showing a hard seam. */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 11%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 11%);
        }

        #corner-image {
            position: fixed;
            bottom: var(--bridge-top);
            left: 7vw;
            width: var(--character-width);
            height: auto;
            transform: translateY(2.8vh);
            animation: walk-right 190s linear infinite;
            z-index: 30;
        }

        #mystar-image {
            position: fixed;
            bottom: calc(var(--bridge-top) - 1vh);
            left: 7vw;
            width: clamp(72px, 6vw, 108px);
            height: auto;
            transform: rotate(180deg);
            animation: walk-right-star 190s linear infinite;
            z-index: 29;
        }

        #notes-image {
            position: fixed;
            bottom: calc(var(--bridge-top) + 6vh);
            left: 11vw;
            width: clamp(70px, 6vw, 108px);
            height: auto;
            animation: note-right 160s linear infinite;
            z-index: 35;
        }

        #tree-image {
            position: fixed;
            bottom: var(--bridge-top);
            left: 0;
            width: clamp(100px, 8vw, 150px);
            height: calc(100vh - var(--bridge-height));
            object-fit: cover;
            object-position: left bottom;
            z-index: 12;
        }

        #castle-link {
            position: fixed;
            right: clamp(42px, 6vw, 105px);
            bottom: var(--bridge-top);
            height: var(--castle-height);
            transform: translateY(3.2vh);
            z-index: 24;
        }

        #castle-image {
            display: block;
            height: 100%;
            width: auto;
            object-fit: contain;
            object-position: center bottom;
            image-rendering: pixelated;
            cursor: pointer;
            /* Feather the ragged bottom cut-off so it fades into the sky. */
            -webkit-mask-image: linear-gradient(to top, transparent 0, #000 15%);
            mask-image: linear-gradient(to top, transparent 0, #000 15%);
        }

        .speech-bubble {
            position: fixed;
            right: clamp(60px, 9vw, 140px);
            bottom: calc(var(--bridge-top) + min(40vh, 410px) - 40px);
            background-color: white;
            border-radius: 10px;
            padding: 14px 16px;
            min-width: 56px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            z-index: 28;
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 40%;
            margin-left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        #stars_bot-image {
            position: fixed;
            top: 34px;
            left: 65%;
            width: clamp(160px, 13vw, 220px);
            height: auto;
            transform: rotate(180deg);
            z-index: 6;
        }

        #star2-image {
            position: fixed;
            top: 10%;
            right: 2%;
            width: clamp(120px, 9vw, 170px);
            height: auto;
            z-index: 6;
        }

        @keyframes walk-right {
            0% {
                left: 7vw;
            }
            50% {
                left: 74vw;
            }
            100% {
                left: 7vw;
            }
        }

        @keyframes walk-right-star {
            0% {
                left: 7vw;
            }
            50% {
                left: 74vw;
            }
            100% {
                left: 7vw;
            }
        }

        @keyframes note-right {
            0% {
                left: 14vw;
            }
            50% {
                left: 51vw;
            }
            100% {
                left: 14vw;
            }
        }

        @media (max-width: 700px) {
            :root {
                --bridge-height: 52svh;
                --character-width: clamp(86px, 17vw, 118px);
                --castle-height: clamp(280px, 44svh, 400px);
            }

            html,
            body {
                width: 100vw;
                height: 100svh;
                min-height: 100svh;
                overflow: hidden;
            }

            #panorama {
                width: 100vw;
                height: 100svh;
            }

            #sun {
                top: calc(0.5% + 28px);
                left: 7%;
                width: 128px;
            }

            #tree-image {
                width: 120px;
            }

            #castle-link {
                right: 24vw;
                bottom: var(--bridge-top);
                transform: translateY(2.4vh);
            }

            .speech-bubble {
                right: 26vw;
                bottom: calc(var(--bridge-top) + 37vh - 34px);
            }

            #stars_bot-image {
                top: 28px;
                left: 68%;
                width: 160px;
            }

            #star2-image {
                top: 7%;
                right: -3%;
                width: 150px;
            }

            @keyframes walk-right {
                0% {
                    left: 28vw;
                }
                50% {
                    left: 28vw;
                }
                100% {
                    left: 28vw;
                }
            }

            @keyframes walk-right-star {
                0% {
                    left: 30vw;
                }
                50% {
                    left: 30vw;
                }
                100% {
                    left: 30vw;
                }
            }

            @keyframes note-right {
                0% {
                    left: 39vw;
                }
                50% {
                    left: 39vw;
                }
                100% {
                    left: 39vw;
                }
            }
        }
    </style>
</head>
<body>
    <nav id="q1-navbar" aria-label="Main navigation">
        <a href="index.html" class="q1-navitem">Home</a>
        <a href="home.html#about" class="q1-navitem">About</a>
        <a href="home.html#work" class="q1-navitem">Work</a>
        <a href="home.html#contact" class="q1-navitem">Contact</a>
    </nav>

    <audio id="myAudio" src="assets/music/Fairy Fountain.mp3" preload="none"></audio>
    <div id="panorama"></div>

    <a href="index.html" aria-label="Go back home">
        <div id="sun"></div>
    </a>

    <div id="bridge"></div>

    <img id="tree-image" src="assets/images/tree.png" alt="">
    <img id="corner-image" src="assets/images/lilb.png" alt="Walking character">
    <img id="notes-image" src="assets/images/notes.png" alt="">
    <img id="stars_bot-image" src="assets/images/star2.png" alt="">
    <img id="star2-image" src="assets/images/star2.png" alt="">
    <img id="mystar-image" src="assets/images/star2.png" alt="">

    <a id="castle-link" href="castle.html" aria-label="Open castle page">
        <img id="castle-image" src="assets/images/castle.gif" alt="Animated castle with lightning">
    </a>
    <div class="speech-bubble">**</div>

    <script src="assets/vr.js"></script>
</body>
</html>

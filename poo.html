<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Videos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Navigation Bar */
        #q1-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            width: auto;
            max-width: 100vw;
            box-sizing: border-box;
            padding: 6px 48px 6px 24px;
            background-color: rgba(32, 40, 59, 0.98);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-family: "IBM Plex Sans", Arial, sans-serif;
        }

        .q1-navitem {
            position: relative;
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            line-height: 1;
            border-radius: 5px;
            padding: 5px 8px;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }

        .q1-navitem::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 1px;
            height: 2px;
            border-radius: 2px;
            background-color: white;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }

        .q1-navitem:hover,
        .q1-navitem:focus-visible {
            background-color: #2856aa;
            transform: translateY(-1px);
            outline: none;
        }

        .q1-navitem:hover::after,
        .q1-navitem:focus-visible::after {
            transform: scaleX(1);
        }
        /* Body and Fonts */
        html {
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #F4F3EF;
            font-family: 'Poppins', sans-serif;
            color: rgba(32, 40, 59, 0.979);
        }

        /* Full-page crayon drawing behind the videos. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background: url("assets/images/crayon.gif") center center / cover no-repeat;
        }

        /* Light scrim so the crayon softens and the posters pop. */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(244, 243, 239, 0.55);
            pointer-events: none;
        }

        h2 {
            text-align: center;
            margin: 56px 0 12px;
            font-size: 48px;
            font-weight: 500;
            font-family: 'Didot', serif;
            color: #202837;
        }

        /* Grid Layout */
        #videos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 20px 20px;
        }

        /* Video Container Styling */
        .video-container {
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .video-container:hover {
            transform: scale(1.03);
        }

        /* Image Styling */
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        /* Overlay with Title */
        .video-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: 600;
            color: white;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.6));
            font-family: 'Bodoni', sans-serif;
        }

        /* Media Query for Mobile */
        @media (max-width: 768px) {
            #videos {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        /* ---- GSAP motion layer (added when GSAP loads + motion allowed) ---- */
        .gsap-active #videos {
            perspective: 1200px;
        }

        .gsap-active .video-container {
            transition: none;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* GSAP owns the hover transform, so drop the CSS scale to avoid a fight. */
        .gsap-active .video-container:hover {
            transform: none;
        }

        .word-mask {
            display: inline-block;
            overflow: hidden;
            padding: 0.06em 0.02em;
            margin: -0.06em 0;
            vertical-align: top;
        }

        .word-inner {
            display: inline-block;
            will-change: transform;
        }

        @media (prefers-reduced-motion: reduce) {
            .video-container,
            .video-container img,
            .q1-navitem,
            .q1-navitem::after {
                transition-duration: 0.001ms !important;
                animation-duration: 0.001ms !important;
            }
        }

        /* Back-to-home button (top left) */
        .back-button {
            position: fixed;
            top: 11px;
            left: 16px;
            z-index: 1001;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 15px 7px 12px;
            background: rgba(255, 255, 255, 0.96);
            color: #202837;
            border-radius: 999px;
            font-family: "IBM Plex Sans", Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .back-button:hover,
        .back-button:focus-visible {
            background: #2856aa;
            color: #fff;
            transform: translateX(-2px);
            outline: none;
        }

        .back-button .arrow {
            font-size: 15px;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .back-button:hover .arrow {
            transform: translateX(-2px);
        }
    </style>
</head>

<body>

    <a href="home.html" class="back-button" aria-label="Back to home">
        <span class="arrow" aria-hidden="true">←</span> Back
    </a>

    <nav id="q1-navbar" aria-label="Main navigation">
        <a href="index.html" class="q1-navitem">Home</a>
        <a href="home.html#home" class="q1-navitem">About</a>
        <a href="home.html#work" class="q1-navitem">Work</a>
        <a href="home.html#contact" class="q1-navitem">Contact</a>
    </nav>

    <div id="media">
        <h2>Music Videos</h2>
        <div id="videos">
            <a href="https://youtu.be/7EWTjf5n6kk" target="_blank" rel="noopener noreferrer">
                <div class="video-container">
                    <img src="assets/videos/EE.png" alt="Ireland" loading="lazy" decoding="async">
                    <span class="video-title">Ireland</span>
                </div>
            </a>
            <a href="https://youtu.be/9G2Gl9u4O2A" target="_blank" rel="noopener noreferrer">
                <div class="video-container">
                    <img src="assets/videos/JP.png" alt="Japan" loading="lazy" decoding="async">
                    <span class="video-title">Japan</span>
                </div>
            </a>
            <a href="https://www.youtube.com/watch?v=p3Yi4r8Nf08&t=45s&ab_channel=BryanAguirre" target="_blank" rel="noopener noreferrer">
                <div class="video-container">
                    <img src="assets/videos/newyork.png" alt="New York" loading="lazy" decoding="async">
                    <span class="video-title">New York</span>
                </div>
            </a>
            <a href="https://youtu.be/1epCPWyym0s?si=Uq5Zvp5unfvvtzW4" target="_blank" rel="noopener noreferrer">
                <div class="video-container">
                    <img src="assets/videos/berlin.png" alt="Berlin" loading="lazy" decoding="async">
                    <span class="video-title">Berlin</span>
                </div>
            </a>
            <a href="https://www.youtube.com/watch?v=wEVXiJr_Ttc&ab_channel=BryanAguirre" target="_blank" rel="noopener noreferrer">
                <div class="video-container">
                    <img src="assets/videos/hawaii.png" alt="Hawaii" loading="lazy" decoding="async">
                    <span class="video-title">Hawaii</span>
                </div>
            </a>
            <a href="https://www.youtube.com/watch?v=Kbx1qkkAtu0&ab_channel=BryanAguirre" target="_blank" rel="noopener noreferrer">
                <div class="video-container">
                    <img src="assets/videos/spain.png" alt="Spain" loading="lazy" decoding="async">
                    <span class="video-title">Spain</span>
                </div>
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        (function () {
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!window.gsap || !window.ScrollTrigger || reduceMotion) return;

            var tiles = Array.prototype.slice.call(document.querySelectorAll('.video-container'));

            // Guarantees every tile ends up visible no matter what — so the grid
            // can never be left blank by a mis-timed trigger or a runtime error.
            function revealAll() {
                if (window.gsap) {
                    gsap.set(tiles, { autoAlpha: 1, y: 0, clearProps: 'clipPath' });
                } else {
                    tiles.forEach(function (t) { t.style.opacity = ''; t.style.visibility = ''; t.style.transform = ''; t.style.clipPath = ''; });
                }
            }

            try {
                gsap.registerPlugin(ScrollTrigger);
                document.documentElement.classList.add('gsap-active');

                var fine = window.matchMedia('(pointer: fine)').matches;

                // Masked, word-by-word reveal for the "Music Videos" masthead.
                var heading = document.querySelector('#media h2');
                if (heading) {
                    var tokens = heading.textContent.split(/(\s+)/);
                    heading.textContent = '';
                    tokens.forEach(function (tok) {
                        if (/^\s*$/.test(tok)) {
                            heading.appendChild(document.createTextNode(tok));
                            return;
                        }
                        var mask = document.createElement('span');
                        mask.className = 'word-mask';
                        var inner = document.createElement('span');
                        inner.className = 'word-inner';
                        inner.textContent = tok;
                        mask.appendChild(inner);
                        heading.appendChild(mask);
                    });
                    gsap.from(heading.querySelectorAll('.word-inner'), {
                        yPercent: 120, duration: 0.9, ease: 'power3.out', stagger: 0.09, delay: 0.15
                    });
                }

                // Lookbook stagger: each tile unmasks upward as its row scrolls in.
                gsap.set(tiles, { autoAlpha: 0, y: 42, clipPath: 'inset(0 0 100% 0)' });
                ScrollTrigger.batch(tiles, {
                    start: 'top 90%',
                    onEnter: function (batch) {
                        gsap.to(batch, {
                            autoAlpha: 1, y: 0, clipPath: 'inset(0 0 0% 0)',
                            duration: 0.9, ease: 'power3.out',
                            stagger: { each: 0.12, grid: 'auto', from: 'start' }
                        });
                    }
                });

                // Ken-Burns parallax: the framed image drifts within each tile.
                tiles.forEach(function (tile) {
                    var img = tile.querySelector('img');
                    if (!img) return;
                    gsap.fromTo(img,
                        { yPercent: -6, scale: 1.12 },
                        {
                            yPercent: 6, ease: 'none',
                            scrollTrigger: { trigger: tile, start: 'top bottom', end: 'bottom top', scrub: true }
                        }
                    );
                });

                // Playful cursor-tilt on each tile (fine pointers only).
                if (fine) {
                    tiles.forEach(function (tile) {
                        tile.addEventListener('mousemove', function (e) {
                            var r = tile.getBoundingClientRect();
                            var px = (e.clientX - r.left) / r.width - 0.5;
                            var py = (e.clientY - r.top) / r.height - 0.5;
                            gsap.to(tile, {
                                rotateY: px * 8, rotateX: -py * 8, scale: 1.03,
                                transformPerspective: 800, transformOrigin: 'center',
                                duration: 0.4, ease: 'power2.out'
                            });
                        });
                        tile.addEventListener('mouseleave', function () {
                            gsap.to(tile, { rotateX: 0, rotateY: 0, scale: 1, duration: 0.6, ease: 'power3.out' });
                        });
                    });
                }

                // Recalculate once fonts/images settle so triggers fire correctly.
                window.addEventListener('load', function () { ScrollTrigger.refresh(); });
                setTimeout(function () { ScrollTrigger.refresh(); }, 600);

                // Failsafe: if any tile is somehow still hidden later, show it.
                setTimeout(function () {
                    tiles.forEach(function (tile) {
                        if (gsap.getProperty(tile, 'opacity') < 1) {
                            gsap.to(tile, { autoAlpha: 1, y: 0, clipPath: 'inset(0 0 0% 0)', duration: 0.5 });
                        }
                    });
                }, 2600);
            } catch (err) {
                if (window.console) { console.warn('Motion layer disabled:', err); }
                revealAll();
            }
        })();
    </script>

</body>

</html>
